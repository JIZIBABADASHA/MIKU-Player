<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIKU</title>
<link rel="stylesheet" href="app.css?v=20261006w1">
<link rel="stylesheet" href="themes.css?v=20261004np20">
<link rel="stylesheet" href="responsive.css?v=20261005r12-art">
<link rel="stylesheet" href="tagedit.css?v=20261005t3">
<link rel="stylesheet" href="convert.css?v=20261007cd8">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("miku.theme")||"miku"}catch(e){document.documentElement.dataset.theme="miku"}</script>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand" id="brand"></div>
    <nav class="nav" id="nav">
      <a href="#/home" data-r="home"><svg class="i"><use href="#i-home"/></svg><span>首頁</span></a>
      <div class="nav-label">音樂庫</div>
      <a href="#/albums" data-r="albums"><svg class="i"><use href="#i-album"/></svg><span>專輯</span><em class="count" id="c-albums"></em></a>
      <a href="#/artists" data-r="artists"><svg class="i"><use href="#i-artist"/></svg><span>演出者</span><em class="count" id="c-artists"></em></a>
      <a href="#/tracks" data-r="tracks"><svg class="i"><use href="#i-list"/></svg><span>曲目</span><em class="count" id="c-tracks"></em></a>
      <a href="#/ytmusic" data-r="ytmusic"><svg class="i"><use href="#i-yt"/></svg><span>YouTube Music</span></a>
      <a href="#/favorites" data-r="favorites"><svg class="i"><use href="#i-heart"/></svg><span>我的最愛</span></a>
      <div class="nav-label" id="nav-cd-label">CD</div>
      <a href="#/cd" data-r="cd"><svg class="i"><use href="#i-disc"/></svg><span>CD</span></a>
      <div class="nav-label">系統</div>
      <a href="#/settings" data-r="settings"><svg class="i"><use href="#i-gear"/></svg><span>設定</span></a>
    </nav>
    <div class="side-foot" id="sidefoot"></div>
  </aside>

  <section id="main">
    <header id="topbar">
      <button class="round-btn" id="back" title="上一頁"><svg class="i"><use href="#i-left"/></svg></button>
      <button class="round-btn" id="fwd" title="下一頁"><svg class="i"><use href="#i-right"/></svg></button>
      <label class="search"><svg class="i"><use href="#i-search"/></svg><input id="q" placeholder="搜尋專輯、演出者、曲目" spellcheck="false" autocomplete="off"><kbd>⌘F</kbd></label>
    </header>
    <div id="content"><div id="view"></div></div>
  </section>

  <footer id="bar">
    <div class="np-mini">
      <div class="np-ext" id="b-ext" hidden></div>
      <div class="art" id="b-art" title="正在播放"></div>
      <div class="txt" id="b-txt"><div class="t" id="b-title"></div><div class="a" id="b-artist"></div></div>
      <button class="icon-btn" id="b-fav" title="加入最愛"><svg class="i"><use href="#i-heart"/></svg></button>
    </div>
    <div class="transport">
      <div class="btns">
        <button class="icon-btn" id="b-shuffle" title="隨機播放"><svg class="i"><use href="#i-shuffle"/></svg></button>
        <button class="icon-btn" id="b-prev" title="上一首"><svg class="i fill"><use href="#i-prev"/></svg></button>
        <button class="playbtn" id="b-play" title="播放 (空白鍵)"><svg class="i fill"><use href="#i-play"/></svg></button>
        <button class="icon-btn" id="b-next" title="下一首"><svg class="i fill"><use href="#i-next"/></svg></button>
        <button class="icon-btn" id="b-repeat" title="重複播放"><svg class="i"><use href="#i-repeat"/></svg></button>
      </div>
      <div class="seek">
        <span class="time num" id="b-pos">0:00</span>
        <div class="slider" id="b-seek"><div class="track"><div class="fill"></div></div><div class="knob"></div><div class="hover-tip num"></div></div>
        <span class="time num" id="b-dur">0:00</span>
      </div>
    </div>
    <div class="right-tools">
      <button class="icon-btn" id="b-queue" title="播放佇列 (Q)"><svg class="i"><use href="#i-queue"/></svg></button>
      <button class="icon-btn" id="b-dsp" title="DSP 與等化器 (D)"><svg class="i"><use href="#i-sliders"/></svg></button>
      <span class="tool-sep"></span>
      <button class="sig" id="b-sig" title="訊號路徑"><i class="dot"></i><span id="b-sigtxt">未播放</span></button>
      <button class="out-btn" id="b-out" title="切換輸出裝置"><svg class="i"><use href="#i-speaker"/></svg><span id="b-outname">輸出</span></button>
      <div class="vol" id="b-vol">
        <button class="icon-btn" id="b-mute" title="靜音 (M)"><svg class="i"><use href="#i-vol"/></svg></button>
        <div class="slider" id="b-volslider"><div class="track"><div class="fill"></div></div><div class="knob"></div><div class="hover-tip num"></div></div>
        <span class="db num" id="b-db"></span>
      </div>
    </div>
  </footer>
</div>

<div id="np" class="nolyrics">
  <div class="np-bg"><div class="layer a"></div><div class="layer b"></div></div>
  <div class="np-ext" id="np-ext" hidden></div>
  <div class="np-top">
    <button class="icon-btn" id="np-close" title="收起 (Esc)"><svg class="i"><use href="#i-down"/></svg></button>
    <div class="grow"></div>
    <span class="src" id="np-src"></span>
    <div class="ly-pick-wrap">
      <button class="pill" id="np-cand" style="display:none"></button>
      <div class="ly-pick" id="ly-pick" hidden></div>
    </div>
    <button class="pill" id="np-trans">翻譯</button>
    <button class="pill on" id="np-lyr"><svg class="i" style="width:16px;height:16px"><use href="#i-lyrics"/></svg>歌詞</button>
  </div>
  <div class="np-wrap">
    <div class="np-left">
      <div class="np-cover" id="np-cover"></div>
      <div class="np-info">
        <div class="np-title" id="np-title"></div>
        <div class="np-artist" id="np-artist"></div>
        <div class="np-badges" id="np-badges"></div>
        <div class="np-seek">
          <div class="slider" id="np-seek"><div class="track"><div class="fill"></div></div><div class="knob"></div><div class="hover-tip num"></div></div>
          <div class="times num"><span id="np-pos">0:00</span><span id="np-dur">0:00</span></div>
        </div>
        <div class="np-ctrl">
          <button class="icon-btn" id="np-shuffle"><svg class="i"><use href="#i-shuffle"/></svg></button>
          <button class="icon-btn" id="np-prev"><svg class="i fill"><use href="#i-prev"/></svg></button>
          <button class="playbtn" id="np-play"><svg class="i fill"><use href="#i-play"/></svg></button>
          <button class="icon-btn" id="np-next"><svg class="i fill"><use href="#i-next"/></svg></button>
          <button class="icon-btn" id="np-repeat"><svg class="i"><use href="#i-repeat"/></svg></button>
        </div>
      </div>
    </div>
    <div class="np-right">
      <div class="lyrics" id="lyrics"></div>
      <div class="ly-offset"><span>歌詞時間</span><button id="ly-minus">−</button><span id="ly-off" class="num">0.0s</span><button id="ly-plus">+</button><button id="ly-auto" class="auto" title="分析音訊，自動對齊歌詞時間">自動</button></div>
    </div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="queue">
  <div class="drawer-head"><h2>播放佇列</h2><button class="icon-btn" data-close><svg class="i"><use href="#i-x"/></svg></button></div>
  <div class="drawer-body" id="queue-body"></div>
</aside>
<aside class="drawer wide" id="dsp">
  <div class="drawer-head"><h2>DSP</h2><span class="switch" id="dsp-master" title="啟用 DSP"></span><button class="icon-btn" data-close><svg class="i"><use href="#i-x"/></svg></button></div>
  <div class="drawer-body" id="dsp-body"></div>
</aside>
<div id="toasts"></div>
