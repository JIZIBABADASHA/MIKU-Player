<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <title>MIKU 下載器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <div class="brand">
        <!-- MIKU's wordmark (wwwroot/core.js Brand.svg), coloured from style.css: this page allows no inline styles -->
        <svg class="wm" width="86" height="34" viewBox="-8 -8 290 114" aria-label="MIKU">
          <g class="wm-ink" fill="none" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 62V4L31 40L60 4V62"/><path d="M140 2V62M182 2L148 34M161 23L186 62"/><path d="M222 2V38a25 25 0 0 0 50 0V2"/>
          </g>
          <g stroke-linejoin="round" stroke-width="5">
            <path class="wm-teal" d="M100 17L95 17L89 49L100 63L111 49L105 17Z"/>
            <path class="wm-stripe" d="M93.5 33L106 26M91.5 45L108.5 36" stroke-width="3" stroke-linecap="round" fill="none"/>
            <path class="wm-pink" d="M92 1H108L105 13H95Z"/>
          </g>
          <path class="wm-track" d="M2 92H272" stroke-width="6" stroke-linecap="round"/>
          <path class="wm-progress" d="M2 92H196" stroke-width="6" stroke-linecap="round"/>
          <circle class="wm-head" cx="196" cy="92" r="10"/><circle cx="196" cy="92" r="4" fill="#fff"/>
        </svg>
        <span class="brand-sub">下載器</span>
      </div>
      <span class="pill" id="platform">正在準備</span>
    </header>

    <section class="intro">
      <h1>安裝你的 MIKU</h1>
      <p>選好擴充套件，一鍵取得已編譯的播放器安裝檔。</p>
    </section>

    <section class="card core">
      <div class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div>
      <div class="grow"><h2>MIKU Player <span class="tag">必要元件</span></h2><p>完整播放器，每次安裝都會包含。</p><small id="coreVersion">按「檢查更新」取得版本</small></div>
      <button id="refresh" class="btn">檢查更新</button>
    </section>

    <div class="section-head"><h2>擴充套件</h2><span>可隨時重新勾選並安裝新的組合</span></div>
    <section id="extensions" aria-label="可選的擴充套件"></section>
    <p id="catalogNotice" class="muted"></p>

    <div class="section-head"><h2>下載與安裝</h2></div>
    <section class="card list">
      <div class="set-row destination"><div class="grow"><h3>暫存下載位置</h3><p id="output" class="path"></p></div><button id="choose" class="btn small">選擇資料夾</button></div>
      <label class="set-row auto-option"><span class="grow"><h3>自動準備播放器與套件更新</h3><small>支援更新功能的新版 MIKU 啟動後每 6 小時檢查 Release；現有 1.4.3 須手動開啟此下載器檢查。</small></span><input type="checkbox" id="auto" checked></label>
    </section>

    <div class="actions"><button id="build" class="btn primary big">下載並開啟安裝程式</button><button id="cancel" class="btn danger" hidden>停止</button></div>
    <p class="hint" id="requirements">使用者電腦不需要 Git、CMake、Python 或編譯工具。安裝完成後會清理下載的安裝檔；請保持網路連線。</p>

    <section class="card progress" aria-live="polite">
      <div class="stage-line"><span class="dot" id="dot"></span><strong id="status">準備就緒</strong></div>
      <ol id="steps"><li data-step="check">檢查</li><li data-step="download">下載</li><li data-step="verify">驗證</li><li data-step="done">完成</li></ol>
    </section>
    <p id="error" class="error" role="alert" hidden></p>
    <section id="result" class="card result" hidden><div class="grow"><h2 id="resultTitle">下載完成</h2><p id="resultInfo"></p></div><button id="openInstaller" class="btn primary">開啟安裝檔</button><button id="openFolder" class="btn">顯示資料夾</button></section>
    <button id="failureFolder" class="btn" hidden>開啟失敗紀錄資料夾</button>
    <details><summary>下載紀錄</summary><pre id="log" aria-label="下載紀錄"></pre></details>
    <footer><span>來源：GitHub 最新正式 Release</span><span id="version"></span></footer>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
